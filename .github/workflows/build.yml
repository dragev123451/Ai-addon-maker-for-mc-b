name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          unzip "AddonAI-v1-iOS-Xcode 2.zip"

      - name: Locate and Build Project
        run: |
          PROJ_PATH=$(find . -name "AddonAI.xcodeproj" -print -quit)
          echo "Found project at: $PROJ_PATH"
          
          mkdir -p Payload
          
          # Clean and attempt build, logging output to build_log.txt
          xcodebuild clean build \
            -project "$PROJ_PATH" \
            -scheme AddonAI \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" > build_log.txt 2>&1 || true

          # Output the last 50 lines of the failure log so we can read it on the iPad screen
          echo "=== SHOWING ERROR LOG ==="
          tail -n 50 build_log.txt
          
          # Check if the compilation succeeded
          if [ -d "$(pwd)/build/AddonAI.app" ]; then
            mv "$(pwd)/build/AddonAI.app" Payload/
            zip -r AddonAI.ipa Payload/
          else
            echo "Build failed. See log output above."
            exit 1
          fi

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AddonAI-Unsigned-IPA
          path: AddonAI.ipa
